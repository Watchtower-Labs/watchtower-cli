name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cli-smoke:
    name: cli-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck CLI
        run: pnpm --filter @watchtower/cli typecheck

      - name: Check CLI formatting
        run: pnpm --filter @watchtower/cli exec prettier --check .

  cli-lint:
    name: cli-lint
    needs: [cli-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Run CLI lint
        run: pnpm --filter @watchtower/cli lint

  py-smoke:
    name: py-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run smoke tests
        run: pytest -q tests/test_basic.py tests/test_validation.py tests/test_cleanup.py tests/test_plugin_cleanup.py

      - name: Type checking smoke
        run: mypy watchtower/ --ignore-missing-imports --follow-imports=normal

      - name: Run tests with coverage
        run: |
          pip install coverage[toml]
          coverage run -m pytest tests/
          coverage report
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: python
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py-smoke-ubuntu-latest
          path: |
            .pytest_cache/
            coverage.xml
          retention-days: 7

  cli-standard:
    name: cli-standard (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    needs: [cli-smoke]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['18', '20', '22']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Run CLI tests
        run: pnpm --filter @watchtower/cli test

      - name: Upload CLI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-test-results-${{ matrix.os }}-${{ matrix.node-version }}
          path: packages/cli/dist/**/*.test.js
          retention-days: 7

  py-standard:
    name: py-standard (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    needs: [py-smoke]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python tests
        run: pytest -q

      - name: Type checking
        run: mypy watchtower/ --ignore-missing-imports --follow-imports=normal

      - name: Lint with ruff
        run: ruff check watchtower/ tests/ --output-format=github

      - name: Format check with black
        run: black --check watchtower/ tests/

      - name: Import order check with isort
        run: |
          pip install isort
          isort --check-only watchtower/ tests/


  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Build web (includes type check)
        run: pnpm --filter @watchtower/web build

  compat-regression:
    name: compat-regression
    needs: [cli-standard, py-standard, web-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate Python import compatibility
        run: python -c "import watchtower; from watchtower import AgentTracePlugin"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Node deps
        run: pnpm install

      - name: Build and verify CLI help
        run: |
          pnpm build:cli
          node packages/cli/dist/index.js --help
